[project]
name = "qwen35-runtime"
version = "0.1.0"
description = "Personal OpenAI-compatible server for the native Qwen3.5-0.8B engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "transformers>=5,<6",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]

[tool.uv]
package = false
