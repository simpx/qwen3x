name: q3x

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - name: Test the standalone executable
        run: Q3X_TEST_BINARY="$PWD/build/q3x" bun test
      - uses: actions/upload-artifact@v4
        with:
          name: q3x-${{ matrix.os }}
          path: agent/build/q3x
          if-no-files-found: error
