name: Course checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run every lesson
        working-directory: 00-lessons
        run: make test
      - name: Build the real-model program and run its self-test
        working-directory: qwen35-0.8b
        run: make test
